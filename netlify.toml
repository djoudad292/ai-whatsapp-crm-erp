[build]
  command = "npm --workspace backend run build && npm --workspace frontend run build"
  publish = "frontend/out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin: the function is reached via the redirects below.
  # Must be root-relative ("/") or absolute — a relative "." resolves
  # against the current route and breaks nested pages (/dashboard/api/*).
  NEXT_PUBLIC_API_URL = "/"
  NEXT_PUBLIC_BACKEND_WEBHOOK_URL = "/webhooks/whatsapp"
  ODOO_URL = "https://chassis-shannon-proceeding-decide.trycloudflare.com"
  ODOO_DB = "odoo"
  ODOO_USER = "admin"
  ODOO_PASSWORD = "admin"

[[redirects]]
  # Static assets and exported pages win first; everything else is the API.
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api"
  status = 200