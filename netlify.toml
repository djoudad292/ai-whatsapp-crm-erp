[build]
  command = "npm --workspace backend run build && npm --workspace frontend run build"
  publish = "frontend/out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin: the function is reached via the redirects below.
  NEXT_PUBLIC_API_URL = "."
  NEXT_PUBLIC_BACKEND_WEBHOOK_URL = "/webhooks/whatsapp"

[[redirects]]
  # Static assets and exported pages win first; everything else is the API.
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api"
  status = 200